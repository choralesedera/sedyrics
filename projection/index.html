<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LyriCSED Projection</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><strong>LyriCSED <span>PROJECTION</span></strong><small>Régie des chants • hors ligne • Tauri</small></div><div class="actions"><button id="open">Ouvrir la projection</button><button id="close" class="secondary">Fermer la projection</button></div></header>
<main><aside><h3>Bibliothèque <span id="count"></span></h3><input id="search" placeholder="Rechercher un chant..."><div id="songs" class="songlist"></div><div class="toolbar"><button id="add">+ Chant</button><button id="import" class="secondary">Importer TXT / JSON</button><button id="export" class="secondary">Exporter JSON</button></div></aside>
<section class="editor"><div class="sectionhead"><div><small>CHANT ACTUEL</small><h2 id="title">Sélectionnez un chant</h2></div><div><button id="edit" class="secondary">Modifier</button><button id="remove" class="danger">Supprimer</button></div></div>
<div id="slides" class="slides"></div><div class="controls"><button id="prev">◀ Précédent</button><button id="black" class="secondary">Masquer les paroles</button><button id="next">Suivant ▶</button></div>
<h3>Fond de projection</h3><div class="settings"><button id="media" class="secondary">Choisir une image ou vidéo</button><button id="plain" class="secondary">Fond uni</button><label>Couleur <input id="color" type="color" value="#081c31"></label><label>Taille <input id="font" type="range" min="32" max="110" value="64"><output id="fontsize">64 px</output></label><label>Assombrir <input id="dim" type="range" min="0" max="85" value="40"><output id="dimval">40 %</output></label></div><p class="hint">Raccourcis : ← et → pour passer d'une strophe à l'autre, B pour masquer les paroles.</p></section>
<aside class="right"><h3>Aperçu de projection</h3><div id="preview" class="preview"><video id="previewVideo" autoplay muted loop playsinline></video><div class="shade" id="previewShade"></div><div id="previewText"></div></div><h3>Programme du culte</h3><p class="muted">Ajoutez les chants dans l'ordre.</p><button id="queueAdd">Ajouter le chant actuel</button><div id="queue" class="queue"></div><button id="queueClear" class="secondary">Vider le programme</button></aside></main>
<dialog id="songDialog"><form method="dialog"><h2 id="dialogTitle">Chant</h2><label>Titre <input id="songTitle" required></label><label>Artiste <input id="artist"></label><label>Paroles (ligne vide entre les strophes)<textarea id="lyrics" rows="14"></textarea></label><div class="actions"><button value="cancel" class="secondary">Annuler</button><button id="saveSong" value="save">Enregistrer</button></div></form></dialog>
<script src="renderer.js"></script></body></html>
